services:
  - type: web
    name: drawing-report-generator
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: REPORT_TTL_HOURS
        value: 24
      - key: REPORT_API_KEY
        generateValue: true
